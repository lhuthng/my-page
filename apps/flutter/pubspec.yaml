publish_to: 'none'
version: 0.11.0+11

environment:
  sdk: ^3.6.0

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  http: ^1.2.0
