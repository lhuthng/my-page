# API subdomain: everything goes straight to the Rust backend. The backend
# serves /api, /media, /posts, /games, /v86, /auth, /sync ... at its root, so
# no path rewriting happens here. Browsers call https://api.huuthangle.site/...
# cross-origin from the apex site, which is why the backend needs
# ALLOWED_ORIGINS=https://huuthangle.site.

server {
    listen 80;
    listen [::]:80;
    server_name api.huuthangle.site;

    # ACME challenges during (re)issuance; everything else upgrades.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    server_name api.huuthangle.site;
    client_max_body_size 100M;

    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-IPCountry $http_cf_ipcountry;
    }

    proxy_buffer_size 256k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.huuthangle.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.huuthangle.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
