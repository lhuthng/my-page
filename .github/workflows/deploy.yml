name: Deploy My Page

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "blog/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      blog: ${{ steps.filter.outputs.blog }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            blog:
              - 'blog/**'

  # ── Build backend image on GitHub's servers and push to GHCR ─────────────
  build-push-backend:
    needs: filter
    if: needs.filter.outputs.blog == 'true' || contains(github.event.head_commit.message, '[deploy blog]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: blog/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blog-backend:latest
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-backend:cache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-backend:cache,mode=max

  # ── Build frontend image on GitHub's servers and push to GHCR ────────────
  build-push-frontend:
    needs: filter
    if: needs.filter.outputs.blog == 'true' || contains(github.event.head_commit.message, '[deploy blog]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: blog/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blog-frontend:latest
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-frontend:cache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-frontend:cache,mode=max

  # SSHs into the Oracle VM, pulls new images, restarts containers, verifies
  deploy-blog:
    needs: [build-push-backend, build-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR on VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull new images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose pull

      - name: Restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose up -d --remove-orphans
            docker image prune -f

      # Migrations run automatically via sqlx::migrate!() when backend starts.
      - name: Wait for backend startup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: sleep 15

      - name: Show backend startup logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Backend startup logs (includes migration output) ==="
            cd ~/MyPage/blog
            docker compose logs backend --tail=40

      - name: Verify backend health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            echo "=== Container status ==="
            docker compose ps
            docker compose ps backend | grep -Eq "(running|Up)" || \
              (echo "ERROR: backend is not running - check migration logs above" && exit 1)

      - name: Show frontend startup logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Frontend startup logs ==="
            cd ~/MyPage/blog
            docker compose logs frontend --tail=20

      - name: Verify frontend health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose ps frontend | grep -Eq "(running|Up)" || \
              (echo "ERROR: frontend is not running" && exit 1)

      - name: Deployment summary
        run: |
          echo "## Deployment complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`ghcr.io/${{ github.repository_owner }}/blog-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`ghcr.io/${{ github.repository_owner }}/blog-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }} (${{ github.ref }})" >> $GITHUB_STEP_SUMMARY
