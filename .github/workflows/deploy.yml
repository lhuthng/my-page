name: Deploy My Page

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "blog/**"
      - "ops/**"
      # macOS-only commits run the gates (the deploy jobs still
      # skip: the paths-filter below matches blog/ and ops/ only).
      - "apps/macos/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [manual deploy] skips the pipeline for local deploys
  # (scripts/emergency/deploy.sh); workflow_dispatch always deploys.
  filter:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[manual deploy]')
    runs-on: ubuntu-latest
    outputs:
      blog: ${{ steps.filter.outputs.blog }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            blog:
              - 'blog/**'
              - 'ops/**'

  # ── Quality gates (CONTRIBUTING.md) ────────────────────────────
  # One macOS runner carries all three suites: Swift needs Xcode.
  # The build jobs wait on this, so a failed gate never deploys.
  gates:
    needs: filter
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: blog/backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: blog/frontend/package-lock.json

      - name: Backend format check
        working-directory: blog/backend
        run: cargo fmt --check

      - name: Backend lint
        working-directory: blog/backend
        run: cargo clippy -- -D warnings

      - name: Backend tests
        working-directory: blog/backend
        run: cargo test

      # npm install, not npm ci: bun.lock is the real lockfile and
      # package-lock.json has drifted from package.json.
      - name: Install frontend dependencies
        working-directory: blog/frontend
        run: npm install

      - name: Frontend format check
        working-directory: blog/frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: blog/frontend
        run: npm test

      - name: macOS tests
        working-directory: apps/macos
        run: make test

  # ── Build backend image on GitHub's servers and push to GHCR ─────────────
  build-push-backend:
    needs: [filter, gates]
    if: |
      (needs.filter.outputs.blog == 'true' || contains(github.event.head_commit.message, '[deploy blog]')) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[manual deploy]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: blog/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blog-backend:latest
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-backend:cache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-backend:cache,mode=max

  # ── Build frontend image on GitHub's servers and push to GHCR ────────────
  build-push-frontend:
    needs: [filter, gates]
    if: |
      (needs.filter.outputs.blog == 'true' || contains(github.event.head_commit.message, '[deploy blog]')) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[manual deploy]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: blog/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blog-frontend:latest
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-frontend:cache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/blog-frontend:cache,mode=max

  deploy-blog:
    needs: [build-push-backend, build-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Log in to GHCR on VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # The VM is not a git checkout: images come from GHCR, and this
      # compose file is the only repo-managed file the runtime reads.
      - name: Sync compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "blog/docker-compose.yml"
          target: "~/MyPage/blog"
          strip_components: 1

      # Repo-managed nginx sites (ops/nginx/): swap in and reload only
      # on change. Certs stay owned by certbot.
      - name: Sync nginx sites to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "ops/nginx/*"
          target: "/tmp/nginx-deploy"
          strip_components: 2

      - name: Activate nginx sites if changed
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            changed=0
            for f in blog.conf root.conf api.conf; do
              src="/tmp/nginx-deploy/$f"
              dst="/etc/nginx/sites-available/$f"
              if ! sudo cmp -s "$src" "$dst"; then
                sudo cp "$src" "$dst"
                sudo ln -sf "/etc/nginx/sites-available/$f" "/etc/nginx/sites-enabled/$f"
                changed=1
              fi
            done
            rm -rf /tmp/nginx-deploy
            if [ "$changed" = "1" ]; then
              sudo nginx -t && sudo systemctl reload nginx
              echo "nginx conf updated and reloaded"
            else
              echo "nginx conf unchanged"
            fi

      - name: Pull new images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose pull

      - name: Restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose up -d --remove-orphans
            docker image prune -f

      # Migrations run on backend startup (sqlx::migrate!()); --wait
      # fails the deploy instead of sleeping a fixed time.
      - name: Wait for backend and frontend to become healthy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            docker compose up -d --wait --wait-timeout 180

      - name: Show backend startup logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Backend startup logs (includes migration output) ==="
            cd ~/MyPage/blog
            docker compose logs backend --tail=40

      - name: Verify backend health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            echo "=== Container status ==="
            docker compose ps
            wget -q -O /dev/null http://127.0.0.1:3001/health || \
              (echo "ERROR: backend is not answering /health - check migration logs above" && exit 1)

      - name: Show frontend startup logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Frontend startup logs ==="
            cd ~/MyPage/blog
            docker compose logs frontend --tail=20

      - name: Verify frontend health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/MyPage/blog
            wget -q -O /dev/null http://127.0.0.1:5000/health || \
              (echo "ERROR: frontend is not answering /health" && exit 1)

      - name: Deployment summary
        run: |
          echo "## Deployment complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`ghcr.io/${{ github.repository_owner }}/blog-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`ghcr.io/${{ github.repository_owner }}/blog-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }} (${{ github.ref }})" >> $GITHUB_STEP_SUMMARY
