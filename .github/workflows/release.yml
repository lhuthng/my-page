name: Release Audiobooks

# Tags of the form v1.2.3 build the Flutter macOS app and attach the zipped
# .app to a GitHub Release. The blog deploy pipeline (deploy.yml) is unrelated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.11.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v5
        with:
          # Release notes compare against the previous tag.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' must look like v1.2.3"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Build the macOS app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Verify the bundle
        run: |
          APP="build/macos/Build/Products/Release/audiobooks.app"
          test -x "$APP/Contents/MacOS/audiobooks"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "${{ steps.version.outputs.version }}"

      - name: Package
        id: package
        run: |
          cd build/macos/Build/Products/Release
          # Keep the .app at the archive root. The capitalised name also lets
          # the existing SwiftUI updater find the bundle it expects.
          mv audiobooks.app Audiobooks.app
          ditto -c -k --sequesterRsrc --keepParent Audiobooks.app \
            "$GITHUB_WORKSPACE/apps/flutter/Audiobooks-${{ steps.version.outputs.version }}.app.zip"
          echo "asset=apps/flutter/Audiobooks-${{ steps.version.outputs.version }}.app.zip" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Audiobooks ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
