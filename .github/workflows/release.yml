name: Release Audiobooks

# Tags of the form v1.2.3 build the Flutter macOS app and Android APK, then
# attach both to one GitHub Release. The blog deploy pipeline (deploy.yml) is
# unrelated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.11.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' must look like v1.2.3"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Build the macOS app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Verify the bundle
        run: |
          APP="build/macos/Build/Products/Release/audiobooks.app"
          test -x "$APP/Contents/MacOS/audiobooks"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "${{ needs.prepare.outputs.version }}"

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          # Keep the .app at the archive root. The capitalised name also lets
          # the existing SwiftUI updater find the bundle it expects.
          mv audiobooks.app Audiobooks.app
          ditto -c -k --sequesterRsrc --keepParent Audiobooks.app \
            "$GITHUB_WORKSPACE/apps/flutter/Audiobooks-${{ needs.prepare.outputs.version }}.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/flutter/Audiobooks-${{ needs.prepare.outputs.version }}.app.zip
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Build the Android APK
        run: |
          flutter pub get
          # The template signs release with the debug key so this APK can be
          # sideloaded directly. Replace that with a release keystore before
          # distributing through Play.
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Audiobooks-${{ needs.prepare.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/flutter/Audiobooks-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  publish:
    needs: [prepare, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Audiobooks ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.app.zip
            dist/*.apk
